server {
    # Cloud Run routes requests to port 8080 by default.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long-cache fingerprinted assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: every unknown route serves index.html so client-side
    # routing (react-router) works on direct navigation / refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
