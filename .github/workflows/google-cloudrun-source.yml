# Builds the Vite app into a container and deploys it to Cloud Run on every
# push to main.
#
# One-time setup (see DEPLOY.md for full details):
#  1. Enable APIs: run, cloudbuild, artifactregistry, iamcredentials.
#  2. Create an Artifact Registry Docker repo (name must match REPOSITORY below).
#  3. Configure Workload Identity Federation for this GitHub repo + a service
#     account with roles: run.admin, artifactregistry.writer, iam.serviceAccountUser.
#  4. Add the repository secrets listed below.
#  5. Update the PROJECT_ID / REGION / SERVICE / REPOSITORY values.

name: 'Deploy to Cloud Run'

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: 'my-project'        # TODO: your Google Cloud project ID
  REGION: 'us-central1'           # TODO: your region
  SERVICE: 'flowcare'             # TODO: your Cloud Run service name
  REPOSITORY: 'flowcare'          # TODO: your Artifact Registry repo name

jobs:
  deploy:
    runs-on: 'ubuntu-latest'

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v4'

      - name: 'Authenticate to Google Cloud'
        id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: '${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT }}'

      - name: 'Set up gcloud'
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: 'Configure Docker for Artifact Registry'
        run: 'gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet'

      - name: 'Build and push image'
        run: |-
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}"
          docker build \
            --build-arg VITE_BASE44_APP_ID="${{ secrets.VITE_BASE44_APP_ID }}" \
            --build-arg VITE_BASE44_APP_BASE_URL="${{ secrets.VITE_BASE44_APP_BASE_URL }}" \
            -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: 'Deploy to Cloud Run'
        id: 'deploy'
        uses: 'google-github-actions/deploy-cloudrun@v2'
        with:
          service: '${{ env.SERVICE }}'
          region: '${{ env.REGION }}'
          image: '${{ env.IMAGE }}'
          flags: '--allow-unauthenticated'

      - name: 'Show URL'
        run: 'echo "Deployed to ${{ steps.deploy.outputs.url }}"'
